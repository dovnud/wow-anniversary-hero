<!-- 1. Webflow: Page settings > Custom code > Head code (or Site settings for all pages) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
<style>

  /* ---------- WOW 9-year hero (everything is scoped under .wow9) ---------- */
  .wow9, .wow9 * { box-sizing: border-box; }

  .wow9 {
    --wow9-photo: url("https://cdn.prod.website-files.com/690e7ceeb3d249294ed6993c/6abf11fe688d1d93af401850_wow1-water-hair-email.jpg");
    --sky: #73d7ff;
    --royal: #1d6bff;
    --orange: #ff7a14;
    --ink: #000;
    position: relative;
    min-height: 100vh;
    min-height: 100svh;
    max-height: 1100px;
    overflow: hidden;
    isolation: isolate;
    background: var(--ink);
    color: #fff;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
  }

  /* photo: slowly breathing so the page never feels frozen */
  .wow9__photo {
    position: absolute; inset: -3%;
    background: var(--wow9-photo) center 30% / cover no-repeat;
    filter: saturate(1.05) contrast(1.05);
    animation: wow9-drift 40s ease-in-out infinite alternate;
    z-index: -3;
  }
  @keyframes wow9-drift { to { transform: scale(1.06) translate3d(-1%, -1%, 0); } }

  /* tone: dark enough for neon to read, open enough for the performers to show */
  .wow9__shade {
    position: absolute; inset: 0; z-index: -2;
    background:
      radial-gradient(ellipse 60% 45% at 50% 38%, rgba(40,130,255,.20), transparent 70%),
      linear-gradient(180deg, rgba(0,0,0,.80) 0%, rgba(0,0,0,.35) 28%, rgba(0,0,0,.55) 58%, rgba(0,0,0,.95) 100%);
  }

  .wow9__gl {
    position: absolute; inset: 0; width: 100%; height: 100%;
    z-index: -1; display: block; pointer-events: none;
  }

  /* CSS stand-in if WebGL is unavailable */
  .wow9__fallback9 {
    display: none;
    position: absolute; left: 50%; top: 4%; transform: translateX(-50%);
    font: 400 clamp(220px, 46vh, 520px)/1 Anton, Impact, sans-serif;
    background: linear-gradient(180deg, #eafaff, #73d7ff 55%, #1d6bff);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 24px rgba(40,140,255,.75));
    z-index: -1;
  }
  .wow9.is-nogl .wow9__fallback9 { display: block; }

  /* content sits on the water, under the numeral */
  .wow9__content {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 2;
    padding: 0 clamp(18px, 4vw, 56px) clamp(28px, 5vh, 56px);
    text-align: center;
  }
  .wow9__content::before {
    content: ""; position: absolute; inset: -40px 0 0; z-index: -1; pointer-events: none;
    background: linear-gradient(180deg, transparent, rgba(0,0,0,.75) 38%, rgba(0,0,0,.92));
  }
  .wow9__h1 {
    margin: 0 auto;
    font-family: Anton, Impact, "Arial Narrow Bold", sans-serif;
    font-weight: 400;
    font-size: clamp(38px, 6.4vw, 100px);
    line-height: 1;
    letter-spacing: .01em;
    text-transform: uppercase;
    text-shadow: 0 2px 30px rgba(0,0,0,.65);
  }
  .wow9__h1 em { font-style: normal; color: var(--sky); }
  .wow9__sub {
    max-width: 660px; margin: clamp(12px, 2vh, 20px) auto 0;
    font-size: clamp(16px, 1.55vw, 20px); line-height: 1.5;
    color: rgba(255,255,255,.92);
    text-shadow: 0 1px 18px rgba(0,0,0,.8);
  }
  .wow9__cta { margin-top: clamp(18px, 3vh, 28px); display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
  .wow9__btn {
    display: inline-block; text-decoration: none;
    font: 400 20px/1 Anton, Impact, sans-serif; text-transform: uppercase; letter-spacing: .05em;
    padding: 18px 36px; border-radius: 0;
    transition: transform .15s, background .2s, box-shadow .2s;
  }
  .wow9__btn--solid { color: #fff; background: var(--orange); }
  .wow9__btn--solid:hover { background: #ff9440; transform: translateY(-2px); box-shadow: 0 10px 30px rgba(255,122,20,.4); }
  .wow9__btn--ghost { color: #000; background: var(--sky); }
  .wow9__btn--ghost:hover { background: #a6e6ff; transform: translateY(-2px); box-shadow: 0 10px 30px rgba(115,215,255,.35); }
  .wow9__btn:focus-visible, .wow9__navlink:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
  .wow9__fine { margin: 18px auto 0; font-size: 14px; color: rgba(255,255,255,.72); text-shadow: 0 1px 12px rgba(0,0,0,.9); }

  @media (max-width: 640px) {
    .wow9__btn { padding: 16px 26px; font-size: 18px; }
    .wow9__cta { gap: 10px; }
  }
  @media (prefers-reduced-motion: reduce) { .wow9__photo { animation: none; } }
</style>
