<!-- 3. Webflow: Page settings > Custom code > Footer code (before </body> tag) -->
<script src="https://cdn.jsdelivr.net/npm/three@0.159.0/build/three.min.js"></script>
<script>
(function () {
  var root = document.getElementById('wow9-hero');
  var canvas = root.querySelector('.wow9__gl');
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

  function fail() { root.classList.add('is-nogl'); }
  if (!window.THREE) return fail();

  var renderer;
  try {
    renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: true, premultipliedAlpha: true });
  } catch (e) { return fail(); }
  renderer.setClearColor(0x000000, 0);

  var scene = new THREE.Scene();
  var camera = new THREE.PerspectiveCamera(32, 1, 0.1, 120);

  /* ------------------------------------------------------------------
     World layout. The numeral stands upright at z = 0, its lower part
     under the surface (y < 0) like the tip of an iceberg. Water is the
     plane y = 0 stretching toward the viewer (+z) and away (-z).
  ------------------------------------------------------------------ */
  var NUM_H = 5.0;            // height of the numeral quad in world units
  var NUM_SUB = 1.0;         // how much of the quad is below the waterline
  var texAspect = 0.72;       // updated when the texture is drawn
  var numTex = new THREE.CanvasTexture(document.createElement('canvas'));
  numTex.generateMipmaps = true;
  numTex.minFilter = THREE.LinearMipmapLinearFilter;
  numTex.premultiplyAlpha = true;
  numTex.anisotropy = 4;

  var uniforms = {
    uTime: { value: 0 },
    uTex: { value: numTex },
    uCam: { value: camera.position },
    uNumW: { value: NUM_H * texAspect },
    uNumH: { value: NUM_H },
    uNumSub: { value: NUM_SUB },
    uBeat: { value: 1 }
  };

  var GLSL_WAVES = [
    'float waveH(vec2 p, float t, float detail){',
    '  float h = 0.0;',
    '  h += sin(dot(p, vec2( 0.35, 1.00)) * 1.15 + t * 0.85) * 0.070;',
    '  h += sin(dot(p, vec2(-0.80, 0.55)) * 1.90 + t * 1.10) * 0.045;',
    '  h += sin(dot(p, vec2( 0.95, 0.20)) * 2.80 - t * 1.35) * 0.028;',
    '  h += sin(dot(p, vec2(-0.30,-1.00)) * 0.62 + t * 0.55) * 0.095;',
    '  h += detail * sin(dot(p, vec2( 0.60, 0.80)) * 5.40 + t * 1.90) * 0.011;',
    '  h += detail * sin(dot(p, vec2(-0.90, 0.40)) * 7.70 - t * 2.30) * 0.007;',
    '  h += detail * sin(dot(p, vec2( 0.10,-0.99)) * 11.0 + t * 2.70) * 0.004;',
    '  return h;',
    '}'
  ].join('\n');

  var water = new THREE.Mesh(
    new THREE.PlaneGeometry(70, 80, 220, 260),
    new THREE.ShaderMaterial({
      uniforms: uniforms,
      transparent: true,
      depthWrite: false,
      blending: THREE.CustomBlending,
      blendEquation: THREE.AddEquation,
      blendSrc: THREE.OneFactor,
      blendDst: THREE.OneMinusSrcAlphaFactor,
      vertexShader: [
        'varying vec3 vW;',
        'uniform float uTime;',
        GLSL_WAVES,
        'void main(){',
        '  vec4 w = modelMatrix * vec4(position, 1.0);',
        '  w.y += waveH(w.xz, uTime, 0.0);',
        '  vW = w.xyz;',
        '  gl_Position = projectionMatrix * viewMatrix * w;',
        '}'
      ].join('\n'),
      fragmentShader: [
        'precision highp float;',
        'varying vec3 vW;',
        'uniform float uTime, uNumW, uNumH, uNumSub, uBeat;',
        'uniform vec3 uCam;',
        'uniform sampler2D uTex;',
        GLSL_WAVES,
        'float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }',
        'vec2 numUV(vec2 xy){ return vec2(xy.x / uNumW + 0.5, (xy.y + uNumSub) / uNumH); }',
        'vec4 numSample(vec2 xy, float bias){',
        '  vec2 uv = numUV(xy);',
        '  if (uv.x < 0.0 || uv.x > 1.0 || uv.y < 0.0 || uv.y > 1.0) return vec4(0.0);',
        '  float edge = smoothstep(0.0, 0.06, uv.x) * smoothstep(1.0, 0.94, uv.x) * smoothstep(0.0, 0.05, uv.y) * smoothstep(1.0, 0.95, uv.y);',
        '  return texture2D(uTex, uv, bias) * edge;',
        '}',
        'void main(){',
        '  vec2 p = vW.xz;',
        '  float e = 0.03;',
        '  float h0 = waveH(p, uTime, 1.0);',
        '  float hx = waveH(p + vec2(e, 0.0), uTime, 1.0);',
        '  float hz = waveH(p + vec2(0.0, e), uTime, 1.0);',
        '  vec3 N = normalize(vec3(-(hx - h0) / e, 1.0, -(hz - h0) / e));',
        '  vec3 V = normalize(vW - uCam);',
        '  float cosT = max(dot(N, -V), 0.0);',
        '  float fres = 0.04 + 0.96 * pow(1.0 - cosT, 4.0);',
        '',
        '  // far fade: water dissolves into the photo instead of ending in a hard horizon',
        '  float far = smoothstep(-34.0, -4.0, vW.z);',
        '  float near = smoothstep(14.0, 4.0, vW.z);',
        '',
        '  vec3 deep = vec3(0.012, 0.030, 0.045);',
        '  vec3 shallow = vec3(0.030, 0.095, 0.115);',
        '  vec3 col = mix(deep, shallow, pow(1.0 - cosT, 2.0) * 0.8);',
        '  float a = 0.58;',
        '',
        '  // reflection of the numeral (analytic ray vs. the upright quad at z = 0)',
        '  vec3 R = reflect(V, N);',
        '  vec3 refl = vec3(0.0); float ra = 0.0;',
        '  if (vW.z > 0.0 && R.z < -0.02) {',
        '    float t = -vW.z / R.z;',
        '    vec3 hit = vW + R * t;',
        '    if (hit.y > 0.0) {',
        '      float blur = 0.3 + hit.y * 0.22 + t * 0.04;',
        '      vec4 s = numSample(hit.xy, blur);',
        '      float fadeR = exp(-hit.y * 0.17);',
        '      refl = s.rgb * fadeR; ra = s.a * fadeR;',
        '    }',
        '  }',
        '',
        '  // the submerged part of the numeral seen through the surface',
        '  vec3 Rf = refract(V, N, 0.75);',
        '  vec3 under = vec3(0.0);',
        '  if (vW.z > 0.0 && Rf.z < -0.02) {',
        '    float t = -vW.z / Rf.z;',
        '    vec3 hit = vW + Rf * t;',
        '    if (hit.y < 0.0) {',
        '      float d = -hit.y;',
        '      vec4 s = numSample(hit.xy, 1.6 + d * 2.2);',
        '      under = s.rgb * exp(-d * 1.55) * 0.9;',
        '    }',
        '  }',
        '  col += under * (1.0 - fres) * 1.15;',
        '',
        '  // sky / ambient tint on grazing angles',
        '  col += vec3(0.10, 0.07, 0.07) * fres * 0.9;',
        '  col += refl * (0.55 + fres * 1.6) * uBeat;',
        '  a += fres * 0.35 + dot(refl, vec3(0.33)) * 0.8 + dot(under, vec3(0.33)) * 0.6;',
        '',
        '  // warm glitter column under the numeral',
        '  vec3 L = normalize(vec3(0.0, 3.2, -0.6) - vW);',
        '  float sp = pow(max(dot(R, L), 0.0), 140.0);',
        '  float sp2 = pow(max(dot(R, L), 0.0), 18.0) * 0.12;',
        '  float spark = step(0.9, hash(floor(p * 70.0) + floor(uTime * 3.0)));',
        '  vec3 warm = vec3(1.0, 0.55, 0.18);',
        '  float colW = exp(-pow(vW.x / (uNumW * 0.55), 2.0));',
        '  col += warm * (sp * 2.4 + sp2) * colW * uBeat;',
        '  col += vec3(1.0, 0.8, 0.5) * spark * sp * 3.0 * colW;',
        '  a += (sp + sp2) * 0.6;',
        '',
        '  // light pooled around the base of the numeral',
        '  float pool = exp(-pow(vW.x / (uNumW * 0.5), 2.0)) * exp(-abs(vW.z) * 1.4);',
        '  col += warm * pool * 0.35 * uBeat;',
        '  a += pool * 0.2;',
        '',
        '  // crest highlights',
        '  float crest = smoothstep(0.075, 0.17, h0);',
        '  col += vec3(0.30, 0.45, 0.50) * crest * 0.18 * (1.0 - far * 0.0);',
        '',
        '  a = clamp(a, 0.0, 1.0) * far * near;',
        '  gl_FragColor = vec4(col * far * near, a);',
        '}'
      ].join('\n')
    })
  );
  water.rotation.x = -Math.PI / 2;
  water.position.z = -12;   // extend further away than toward the camera
  scene.add(water);

  // upright numeral, only the part above the waterline (the rest is drawn by the water)
  var num = new THREE.Mesh(
    new THREE.PlaneGeometry(1, 1),
    new THREE.ShaderMaterial({
      uniforms: uniforms,
      transparent: true,
      depthWrite: false,
      blending: THREE.CustomBlending,
      blendEquation: THREE.AddEquation,
      blendSrc: THREE.OneFactor,
      blendDst: THREE.OneMinusSrcAlphaFactor,
      vertexShader: [
        'varying vec2 vUv; varying float vY;',
        'void main(){ vUv = uv; vec4 w = modelMatrix * vec4(position, 1.0); vY = w.y;',
        '  gl_Position = projectionMatrix * viewMatrix * w; }'
      ].join('\n'),
      fragmentShader: [
        'varying vec2 vUv; varying float vY;',
        'uniform sampler2D uTex; uniform float uBeat, uTime;',
        'void main(){',
        '  vec4 c = texture2D(uTex, vUv);',
        '  float m = smoothstep(-0.02, 0.10, vY);',
        '  float flick = 1.0 + 0.025 * sin(uTime * 23.0) * sin(uTime * 3.1);',
        '  gl_FragColor = c * m * uBeat * flick;',
        '}'
      ].join('\n')
    })
  );
  scene.add(num);

  /* ---------------- neon numeral texture ---------------- */
  function drawNumeral() {
    var W = 900, H = 1200;
    var c = numTex.image;
    c.width = W; c.height = H;
    var g = c.getContext('2d');
    g.clearRect(0, 0, W, H);
    var font = '400 1000px Anton, Impact, "Arial Black", sans-serif';
    g.font = font;
    g.textAlign = 'center';
    g.textBaseline = 'alphabetic';
    var m = g.measureText('9');
    var asc = m.actualBoundingBoxAscent || 780, desc = m.actualBoundingBoxDescent || 0;
    var gw = (m.actualBoundingBoxLeft || 0) + (m.actualBoundingBoxRight || 600);
    // scale the glyph so it fills ~70% of the card width / 66% of height, leaving room for the glow
    var scale = Math.min((W * 0.62) / gw, (H * 0.64) / (asc + desc));
    var cx = W / 2, baseY = H / 2 + (asc - desc) * scale / 2;
    function glyph(mode, style, lw) {
      g.save();
      g.translate(cx, baseY); g.scale(scale, scale);
      g.font = font; g.textAlign = 'center';
      if (mode === 'fill') { g.fillStyle = style; g.fillText('9', 0, 0); }
      else { g.lineJoin = 'round'; g.lineWidth = lw / scale; g.strokeStyle = style; g.strokeText('9', 0, 0); }
      g.restore();
    }
    // outer halo, built in passes so it stays soft but wide
    var passes = [[130, 'rgba(255,60,20,.55)'], [70, 'rgba(255,90,25,.7)'], [30, 'rgba(255,140,40,.8)']];
    passes.forEach(function (p) {
      g.save(); g.shadowColor = p[1]; g.shadowBlur = p[0];
      glyph('stroke', p[1], 10); g.restore();
    });
    // warm red edge, then amber body, then hot core
    glyph('stroke', '#e8330f', 26);
    var grad = g.createLinearGradient(0, baseY - asc * scale, 0, baseY + desc * scale);
    grad.addColorStop(0, '#ffcf6a'); grad.addColorStop(0.45, '#ffa22a'); grad.addColorStop(1, '#ff6a22');
    glyph('fill', grad);
    g.save();
    g.globalCompositeOperation = 'source-atop';
    var core = g.createRadialGradient(cx, H * 0.42, 20, cx, H * 0.42, H * 0.36);
    core.addColorStop(0, 'rgba(255,236,170,.5)'); core.addColorStop(0.5, 'rgba(255,214,120,.25)'); core.addColorStop(1, 'rgba(255,214,120,0)');
    g.fillStyle = core; g.fillRect(0, 0, W, H);
    g.restore();
    // thin bright tube line just inside the edge
    g.save(); g.globalCompositeOperation = 'source-atop';
    glyph('stroke', 'rgba(255,236,170,.0)', 0);
    g.restore();

    texAspect = W / H;
    uniforms.uNumW.value = NUM_H * texAspect;
    numTex.needsUpdate = true;
    num.scale.set(NUM_H * texAspect, NUM_H, 1);
    num.position.set(0, NUM_H / 2 - NUM_SUB, 0);
  }
  drawNumeral();
  if (document.fonts && document.fonts.load) {
    document.fonts.load('400 200px Anton', '9').then(function () { drawNumeral(); renderOnce(); }).catch(function () {});
  }

  /* ---------------- framing ---------------- */
  var CAM_Y = 2.0;
  function resize() {
    var w = root.clientWidth, h = root.clientHeight;
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    renderer.setPixelRatio(dpr);
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    // keep the numeral fully in frame on tall/narrow screens
    var tanH = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
    var needW = NUM_H * texAspect * 1.9;
    var dist = Math.max(15, needW / (2 * tanH * camera.aspect));
    camera.position.set(0, CAM_Y, dist);
    camera.lookAt(0, CAM_Y, 0);
    camera.updateProjectionMatrix();
    // slide the scene up/down so the waterline sits at a fixed fraction of the hero height
    var wlFrac = w < 700 ? 0.40 : 0.43;
    var ndcNow = -CAM_Y / (dist * tanH);          // where (0,0,0) lands with the level camera
    var ndcWant = 1 - 2 * wlFrac;
    camera.projectionMatrix.elements[9] = -(ndcWant - ndcNow);
    camera.projectionMatrixInverse.copy(camera.projectionMatrix).invert();
    renderOnce();
  }

  /* ---------------- loop ---------------- */
  var running = false, raf = 0, t0 = performance.now();
  function renderOnce() { uniforms.uTime.value = reduce ? 4.0 : (performance.now() - t0) / 1000; renderer.render(scene, camera); }
  function loop() {
    if (!running) return;
    renderOnce();
    raf = requestAnimationFrame(loop);
  }
  function start() { if (!running && !reduce) { running = true; loop(); } }
  function stop() { running = false; cancelAnimationFrame(raf); }

  if ('IntersectionObserver' in window) {
    new IntersectionObserver(function (e) { e[0].isIntersecting ? start() : stop(); }).observe(root);
  } else { start(); }
  document.addEventListener('visibilitychange', function () { document.hidden ? stop() : start(); });
  if ('ResizeObserver' in window) new ResizeObserver(resize).observe(root); else window.addEventListener('resize', resize);
  resize();
  window.__wow9 = { renderOnce: renderOnce, uniforms: uniforms };
})();
</script>
